<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- data-rh marks a tag as owned by react-helmet, so SEO.tsx replaces it per page
         instead of adding a second copy. -->
    <!-- Icons stay out of react-helmet (no data-rh) so they're never swapped per page. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F0EB" />

    <!-- Fonts are self-hosted (src/fonts.css). Preload the latin files the first screen uses so
         they arrive with the CSS instead of after it: hero serif, mono labels, body. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/instrument-serif-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/jetbrains-mono-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin.woff2" />

    <!-- Fallback head for the dev server. Production pages are prerendered (scripts/prerender.mjs):
         these data-rh tags are replaced with each page's own title, description, canonical,
         social tags and JSON-LD from SEO.tsx. -->
    <title>Abdul Wasih | Software Engineer</title>
    <meta
      name="description"
      content="Abdul Wasih is a software engineer in Bangalore who builds products end to end, from web apps and payments to AI features."
      data-rh="true"
    />
    <link rel="canonical" href="https://wasihh.tech/" data-rh="true" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable profile" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Microsoft Clarity analytics (deferred to end of body so it doesn't block FCP/LCP) -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "ub71xbza5s");
    </script>
  </body>
</html>
